name: Flatten Night Shift Duo v8 source

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  flatten:
    if: ${{ github.event.head_commit.message != '[source-flatten] Night Shift Duo v8.0 full source' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Rebuild and verify v8
        shell: bash
        run: |
          set -euo pipefail
          test -f night_shift_duo_game_render.tar.gz
          test -f v8patch/p00.b64
          test -f v8patch/p01.b64

          rm -rf /tmp/nsd-app
          mkdir -p /tmp/nsd-app
          tar -xzf night_shift_duo_game_render.tar.gz -C /tmp/nsd-app
          cat v8patch/p00.b64 v8patch/p01.b64 | base64 -d | gzip -d > /tmp/night_shift_duo_v8.patch

          cd /tmp/nsd-app
          git apply --check /tmp/night_shift_duo_v8.patch
          git apply /tmp/night_shift_duo_v8.patch

          node --check server.js
          node --check public/client.js
          grep -q '"version": "8.0.0"' package.json
          npm ci --omit=dev

          PORT=10000 node server.js >/tmp/nsd-v8.log 2>&1 &
          PID=$!
          sleep 2
          curl -fsS http://127.0.0.1:10000/ >/dev/null
          kill "$PID" || true

      - name: Replace repository with clean v8 source
        shell: bash
        run: |
          set -euo pipefail

          find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +

          cp /tmp/nsd-app/package.json "$GITHUB_WORKSPACE/"
          cp /tmp/nsd-app/package-lock.json "$GITHUB_WORKSPACE/"
          cp /tmp/nsd-app/server.js "$GITHUB_WORKSPACE/"
          cp /tmp/nsd-app/render.yaml "$GITHUB_WORKSPACE/"
          cp -a /tmp/nsd-app/public "$GITHUB_WORKSPACE/"

          mkdir -p "$GITHUB_WORKSPACE/saves"
          touch "$GITHUB_WORKSPACE/saves/.gitkeep"

          cat > "$GITHUB_WORKSPACE/.gitignore" <<'EOF'
          node_modules/
          saves/*.json
          !saves/.gitkeep
          .DS_Store
          npm-debug.log*
          EOF

          cat > "$GITHUB_WORKSPACE/README.md" <<'EOF'
          # Night Shift Duo v8.0

          Полная исходная сборка Night Shift Duo v8.0.

          ## Render
          Build command: `bash build-render.sh`
          Start command: `bash start-render.sh`

          ## Локальный запуск
          `npm ci`
          `npm start`
          EOF

          cat > "$GITHUB_WORKSPACE/build-render.sh" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          npm ci --omit=dev
          EOF

          cat > "$GITHUB_WORKSPACE/start-render.sh" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          npm start
          EOF

          chmod +x "$GITHUB_WORKSPACE/build-render.sh" "$GITHUB_WORKSPACE/start-render.sh"

      - name: Commit clean v8 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Night Shift Duo Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "[source-flatten] Night Shift Duo v8.0 full source"
          git push origin HEAD:main
