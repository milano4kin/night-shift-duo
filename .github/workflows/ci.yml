name: Dread Shift CI

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate release metadata
        run: |
          node -e 'const p=require("./package.json"),l=require("./package-lock.json");if(p.version!==l.version||p.version!==l.packages[""].version)throw new Error("package-lock version mismatch")'
          grep -q 'npm ci --omit=dev' build-render.sh
      - name: Install build dependencies
        run: npm ci --omit=dev --no-audit --no-fund
      - name: Static patch syntax
        run: |
          node --check dread_shift_v8_8_patch.js
          node --check dread_shift_v8_8_1_patch.js
          node --check dread_shift_v8_8_2_patch.js
          node --check dread_shift_v8_9_patch.js
          node --check dread_shift_v8_9_2_patch.js
          node --check dread_shift_v8_9_3_patch.js
          node --check dread_shift_v8_9_4_patch.js
          node --check dread_shift_v8_9_5_patch.js
          node --check dread_shift_v8_9_6_patch.js
          node --check dread_shift_v8_9_7_patch.js
          node --check scripts/protect_client.js
          node --check db_bridge.js
          cp v88_client_extension.jsfrag /tmp/v88_client_extension.js
          node --check /tmp/v88_client_extension.js
      - name: Apply canonical audited runtime
        run: npm run patch:runtime
      - name: Validate patched runtime files
        run: |
          node --check server.js
          node --check public/client.js
          node --check db_bridge.js
          grep -q 'const BUILD_VERSION = "8.9.7"' server.js
          grep -q 'DREAD SHIFT v8.9.7 client' public/client.js
          grep -q 'DREAD SHIFT v8.9.3 db' db_bridge.js
      - name: Full regression tests
        run: npm test
      - name: Protect production browser client
        run: node scripts/protect_client.js
      - name: Validate production protection
        shell: bash
        run: |
          test ! -f public/client.js
          grep -Eq '<script src="assets/game\.[a-f0-9]{12}\.min\.js"></script>' public/index.html
          BUNDLE="$(grep -Eo 'assets/game\.[a-f0-9]{12}\.min\.js' public/index.html | head -n1)"
          test -n "$BUNDLE"
          test -f "public/$BUNDLE"
          node --check "public/$BUNDLE"
          test ! -f "public/$BUNDLE.map"
          ! grep -q 'sourceMappingURL' "public/$BUNDLE"
          grep -q 'PROD_CLIENT_GUARD' server.js
          grep -q 'const BUILD_VERSION = "8.9.7"' server.js
