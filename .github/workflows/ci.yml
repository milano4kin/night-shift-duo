name: Dread Shift CI

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Static patch syntax
        run: |
          node --check dread_shift_v8_8_patch.js
          node --check dread_shift_v8_8_1_patch.js
      - name: Apply full runtime patch chain
        run: |
          node auth_policy_patch.js
          node hud_layout_patch.js
          node network_smoothing_patch.js
          node copy_polish_patch.js
          node lobby_tools_patch.js
          node lobby_visibility_patch.js
          node lobby_layer_patch.js
          node dread_shift_overhaul_patch.js
          node dread_shift_v8_2_patch.js
          node dread_shift_v8_3_patch.js
          node dread_shift_v8_4_patch.js
          node dread_shift_v8_5_1_patch.js
          node dread_shift_v8_5_2_patch.js
          node dread_shift_v8_5_3_patch.js
          node dread_shift_v8_5_4_patch.js
          node dread_shift_v8_6_patch.js
          node dread_shift_v8_6_1_patch.js
          node dread_shift_v8_6_2_patch.js
          node dread_shift_v8_6_3_patch.js
          node dread_shift_v8_7_patch.js
          node dread_shift_v8_7_1_patch.js
          node dread_shift_v8_7_2_patch.js
          node dread_shift_v8_8_patch.js
          node dread_shift_v8_8_1_patch.js
      - name: Validate patched runtime files
        run: |
          node --check server.js
          node --check public/client.js
      - name: Desktop regression tests
        run: node --test tests/desktop_patch.test.js
      - name: Movement and release-order tests
        run: node --test tests/movement_patch.test.js
      - name: v8.8 feature tests
        run: node --test tests/v8_8_patch.test.js
