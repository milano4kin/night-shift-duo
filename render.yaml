services:
  - type: web
    name: night-shift-duo
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: bash build-render.sh
    startCommand: bash start-render.sh
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: night-shift-duo-db
          property: connectionString

databases:
  - name: night-shift-duo-db
    plan: free
    region: frankfurt
    postgresMajorVersion: "18"
